name: ovvas
description: "Ovvas: a calm, ad-free habit tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  supabase_flutter: ^2.18.3
  pdf: ^3.13.1
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/logo_mark.png
    - assets/fonts/

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: "#FEFDF5"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#FEFDF5"
    theme_color: "#0B4D3A"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
