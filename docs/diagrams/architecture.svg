<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ovvas-architecture-title ovvas-architecture-desc" id="architecture-root">
        <title id="ovvas-architecture-title">How Ovvas works</title>
        <desc id="ovvas-architecture-desc">Architecture of the Ovvas Flutter app: screens call HabitStore, which saves every change to the local Drift database first and then asks CloudSync to back it up to Supabase or keep it on the phone.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:   #f5f6f2;
      --color-ink:     #15231f;
      --color-muted:   #56645d;
      --color-accent:  #1e6b5c;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root .notes { margin-top: 1.25rem;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1rem;
      color: var(--color-muted);
      max-width: 60ch; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
