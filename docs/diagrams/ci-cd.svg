<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ovvas-ci-cd-title ovvas-ci-cd-desc" id="ci-cd-root">
        <title id="ovvas-ci-cd-title">Ovvas CI/CD pipeline</title>
        <desc id="ovvas-ci-cd-desc">GitHub Actions pipeline for Ovvas: every pull request, push to main and v* tag runs analyze and test; main and tags then build a release APK, and tags publish it as a GitHub Release.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ci-cd-root { --color-paper:   #f5f6f2;
      --color-ink:     #15231f;
      --color-muted:   #56645d;
      --color-accent:  #1e6b5c;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ci-cd-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ci-cd-root .diagram-container { width: 100%; overflow-x: auto; }
      #ci-cd-root .notes { margin-top: 1.25rem;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1rem;
      color: var(--color-muted);
      max-width: 60ch; }
      @media print {
#ci-cd-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="ci-cd-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#56645d"/></marker>
          <marker id="ci-cd-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1e6b5c"/></marker>
          <marker id="ci-cd-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94600a"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f6f2"/>
<!-- zones -->
<rect x="216" y="96" width="216" height="328" rx="8" fill="#15231f" stroke="#15231f" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.1"/>
